[controller]
controller ansible_host=192.168.56.10 ansible_connection=local

[compute]
compute1 ansible_host=192.168.56.11 ansible_user=vagrant ansible_ssh_private_key_file=/vagrant/.vagrant/machines/compute1/virtualbox/private_key

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'